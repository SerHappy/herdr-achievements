id = "herdr-achievements"
name = "Herdr Achievements"
version = "0.3.1"
min_herdr_version = "0.7.5"
description = "A cozy terminal trophy room for your AI agent herd."
platforms = ["macos", "linux"]

[[build]]
command = ["bash", "scripts/install.sh"]

[[actions]]
id = "open"
title = "Open achievements"
command = ["./bin/herdr-achievements", "open"]

[[panes]]
id = "achievements"
title = "Herdr Achievements"
placement = "popup"
width = 88
height = 26
command = ["./bin/herdr-achievements", "show"]

[[startup]]
command = ["./bin/herdr-achievements", "reconcile"]

[[events]]
on = "pane.agent_detected"
command = ["./bin/herdr-achievements", "event"]

[[events]]
on = "pane.agent_status_changed"
command = ["./bin/herdr-achievements", "event"]

[[events]]
on = "pane.closed"
command = ["./bin/herdr-achievements", "event"]

[[events]]
on = "pane.exited"
command = ["./bin/herdr-achievements", "event"]
