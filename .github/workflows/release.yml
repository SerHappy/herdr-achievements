name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release workflow must run from main; got $GITHUB_REF" >&2
            exit 1
          fi

      - name: Validate manifest version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^version[[:space:]]*=/ { print $2; exit }' herdr-plugin.toml)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Manifest version must have the format X.Y.Z; got: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            local os=$1 arch=$2 output=$3
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" \
              -o "dist/$output" ./cmd/herdr-achievements
          }
          build darwin arm64 herdr-achievements-darwin-arm64
          build darwin amd64 herdr-achievements-darwin-amd64
          build linux arm64 herdr-achievements-linux-arm64
          build linux amd64 herdr-achievements-linux-amd64
          (cd dist && sha256sum herdr-achievements-*) > dist/SHA256SUMS

      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          notes=$'Prebuilt binaries are available for macOS and Linux on arm64 and amd64.\n\nThe Herdr installer selects the matching binary and verifies its SHA-256 checksum before installation.'
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" != "true" ]]; then
              echo "Release $TAG is already published; refusing to overwrite it" >&2
              exit 1
            fi
            echo "Reusing existing draft release $TAG"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "Herdr Achievements $VERSION" --notes "$notes"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release upload "$TAG" dist/herdr-achievements-* dist/SHA256SUMS --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
